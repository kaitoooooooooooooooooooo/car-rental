name: car_rent_client
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  http: ^1.6.0
  equatable: ^2.0.8
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.0
  syncfusion_flutter_sliders: ^34.2.5
  syncfusion_flutter_charts: ^34.2.5
  calendar_date_picker2: ^3.0.0
  go_router: ^18.1.1
  google_maps_flutter_web: ^0.6.5
  google_maps_flutter: ^2.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  adaptive_icon_background: "#1D1D1D"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#1D1D1D"
    theme_color: "#7B1B38"

